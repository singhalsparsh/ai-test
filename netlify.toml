[build]
  command = "npm run build"
  publish = "dist"

# Proxy /api/* to zrok backend tunnel
[[redirects]]
  from = "/api/*"
  to = "https://aurr6c2otm3f.shares.zrok.io/api/:splat"
  status = 200
  force = true

# SPA fallback for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
