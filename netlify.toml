[build]
  command = "npm run build"
  publish = "dist"

# Proxy /api/* to ngrok backend tunnel
[[redirects]]
  from = "/api/*"
  to = "https://unguided-anymore-size.ngrok-free.dev/api/:splat"
  status = 200
  force = true

# SPA fallback for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
